name: Assemble one release APK
description: Build the oss release APK set and keep only the split whose libgojni.so matches the requested ABI.
inputs:
  abi:
    description: Android ABI directory name, such as arm64-v8a
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - name: Install Android SDK and NDK 25.0.8775105
      shell: bash
      run: bash buildScript/ci/setup_android_sdk.sh
    - name: Download geo assets
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bash buildScript/lib/assets.sh
    - name: Assemble oss release
      shell: bash
      env:
        BUILD_PLUGIN: none
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source buildScript/ci/prepare_release_keystore.sh
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
        chmod +x ./gradlew
        # Maven Central occasionally returns 429 while four ABI jobs resolve
        # the same Gradle plugins. Retry the assemble before giving up.
        assemble_once() {
          ./gradlew :app:assembleOssRelease --stacktrace
        }
        if ! assemble_once; then
          echo "assemble failed; retrying after a pause"
          sleep 45
          if ! assemble_once; then
            echo "assemble failed again; retrying after a longer pause"
            sleep 90
            assemble_once
          fi
        fi
    - name: Keep only the verified ${{ inputs.abi }} APK
      shell: bash
      run: bash buildScript/ci/verify_apk_abi.sh "${{ inputs.abi }}" app/build/outputs/apk/oss/release dist-apks
    - name: Require package moe.nyabox and the release certificate
      shell: bash
      run: |
        set -euo pipefail
        aapt="$ANDROID_HOME/build-tools/35.0.1/aapt"
        version=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
        bash buildScript/ci/verify_release_cert.sh dist-apks
        for apk in dist-apks/*.apk; do
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | grep -q "package: name='moe.nyabox' "
          echo "$badging" | grep -q "versionName='$version'"
          echo "$badging" | grep -q "application-label:'NyaBox'"
        done
